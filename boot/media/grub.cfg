serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set default=0
set timeout=5

menuentry "AIOS (console on display, mirrored to serial)" {
  linux /boot/vmlinuz console=ttyS0,115200 console=tty0 quiet loglevel=3
  initrd /boot/initramfs.img
}
menuentry "AIOS (console on serial port)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet loglevel=3
  initrd /boot/initramfs.img
}
