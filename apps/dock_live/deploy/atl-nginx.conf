# Dock Live on atl-ga-1.tireserv.com, served by the grain app on 127.0.0.1:8577 (apps/dock_live in aios).
# Same shape as the warehouse touches page (00-warehouse-live.conf): the PHP-style ?route= picks the app's path,
# and nginx asks the app's key check (/dockauth: an active apikeys key + a userid that is not admin) first.
#
#   https://atl-ga-1.tireserv.com/?route=apir/warehouse/dock/board&key=<api key>&userid=<user>         the wall board
#   https://atl-ga-1.tireserv.com/?route=apir/warehouse/dock/stream&kind=bays&key=<api key>&userid=<user>
#   ...dock/bays, ...dock/picks                                                                       JSON
#
# Two parts. 1) this file as /etc/nginx/conf.d/00-dock-live.conf (http level, like 00-warehouse-live.conf):

map $arg_route $dock_path {
    "~*^apir(/|%2F)warehouse(/|%2F)dock(/|%2F)board$"  /;
    "~*^apir(/|%2F)warehouse(/|%2F)dock(/|%2F)bays$"   /bays;
    "~*^apir(/|%2F)warehouse(/|%2F)dock(/|%2F)picks$"  /picks;
    "~*^apir(/|%2F)warehouse(/|%2F)dock(/|%2F)stream$" /stream;
    default "";
}

