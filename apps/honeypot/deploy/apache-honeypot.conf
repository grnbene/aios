# Apache 2.4: send ONLY bait requests to the aios honeypot sidecar on 127.0.0.1:8899; everything else untouched.
# Install:  a2enmod proxy proxy_http rewrite headers
#           cp apache-honeypot.conf /etc/apache2/conf-available/aios-honeypot.conf
#           then inside each   <VirtualHost ...>   you want trapped:   Include conf-available/aios-honeypot.conf
#           apachectl configtest && systemctl reload apache2
# Behind Cloudflare? Enable mod_remoteip (RemoteIPHeader CF-Connecting-IP + RemoteIPTrustedProxy <CF ranges>)
# so REMOTE_ADDR is the real client - that's what gets reported.

RewriteEngine On
RewriteCond %{REQUEST_URI} (^|/)\.env([._-][^/]*)?$ [NC,OR]
RewriteCond %{REQUEST_URI} /(wp-config\.php|\.git/config)$ [NC,OR]
RewriteCond %{THE_REQUEST} \.\./|%2e%2e [NC,OR]
RewriteCond %{REQUEST_URI} ^/px/
RewriteRule ^ http://127.0.0.1:8899%{REQUEST_URI} [P,L]

# the one address the sidecar believes (overwrites anything the client sent under that name). Apache 2.4.10+.
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
ProxyPreserveHost On
