# nginx: send ONLY bait requests to the aios honeypot sidecar on 127.0.0.1:8899; everything else is untouched.
# Install:  cp nginx-honeypot.conf /etc/nginx/snippets/aios-honeypot.conf
#           then inside each   server { ... }   you want trapped:   include snippets/aios-honeypot.conf;
#           nginx -t && systemctl reload nginx
# Behind Cloudflare? Configure nginx's realip module (set_real_ip_from <CF ranges>; real_ip_header
# CF-Connecting-IP;) so $remote_addr is the real client - that's what gets reported.

set $aios_bait 0;
if ($uri ~* "(^|/)\.env([._-][^/]*)?$")              { set $aios_bait 1; }   # .env, .env.local, .env.bak ...
if ($uri ~* "/(wp-config\.php|\.git/config)$")      { set $aios_bait 1; }
if ($request_uri ~* "\.\./|%2e%2e")                  { set $aios_bait 1; }   # ../../proc/self/environ etc.
if ($uri ~ "^/px/")                                  { set $aios_bait 1; }   # bait callbacks (collect_url)
if ($aios_bait) { rewrite ^ /__aios_honeypot__ last; }

location = /__aios_honeypot__ {
    internal;
    proxy_pass http://127.0.0.1:8899$request_uri;     # the original path + query, exactly as sent
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # the one address the sidecar believes
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
