# aios-webserver config for an EDGE NODE (any server you want trapped).
# Start with:   aios-webserver /etc/aios/node.conf
# Replace every CHANGE-ME. Keep your existing vhost directives (root, php, cert/key...) - add the env_honeypot_* lines.

vhost example.com {
  listen 80
  root /var/www/example.com            # CHANGE-ME: your real site root

  env_honeypot on                       # serve the powerless decoy on .env / config probes
  env_honeypot_store /var/lib/aios/honeypot-store      # tamper-evident substrate record (the authoritative copy)
  env_honeypot_feed  /var/log/aios/honeypot.jsonl      # local JSON-lines copy
  env_honeypot_geo   /etc/aios/geo.csv                 # optional: offline IP->location table (see README)

  # Report to the hub. Every node sends here, plus a heartbeat every 60s - a node that stops shows "NOT REPORTING".
  env_honeypot_forward https://hub.example.com/honeypot/ingest  # CHANGE-ME: your aios-webserver hub URL + /honeypot/ingest
  env_honeypot_token_file /etc/aios/fleet.token        # the shared fleet secret (same file on every node + hub)

  # Bait callback: a URL on a domain YOU control that points at a node running this config. Without it you get
  # grabs but never callbacks (the decoy's API URL would end in .invalid).
  env_honeypot_collect_url https://cdn-assets.example.com/px    # CHANGE-ME
  env_honeypot_collect /px/

  # Extra bait paths beyond .env (regex, matched against path+query). Add your own.
  honeypot_path /wp-config\.php
  honeypot_path /\.git/config
  honeypot_path \.\./                    # path traversal attempts like ../../proc/self/environ
}
