# aios-webserver as a SIDECAR next to nginx or Apache. It listens on 127.0.0.1 only and never faces the
# internet: nginx/Apache keep serving your site and hand it only the bait requests (see nginx-honeypot.conf /
# apache-honeypot.conf). It serves the powerless decoy, records the grab, and reports to your hub.
# Start with:   AIOS_NODE=<this-server-name> aios-webserver /etc/aios/sidecar.conf

vhost honeypot-sidecar {
  listen 8899 loopback
  root /var/lib/aios/sidecar-empty      # an empty directory; nothing real is ever served from here

  env_honeypot on
  # nginx/Apache put the real client address in X-Real-IP. Trusted only because the peer is 127.0.0.1; any
  # CF-Connecting-IP / X-Forwarded-For the attacker sent themselves is kept as evidence but never believed.
  env_honeypot_real_ip_header X-Real-IP

  env_honeypot_store /var/lib/aios/honeypot-store
  env_honeypot_feed  /var/log/aios/honeypot.jsonl
  env_honeypot_geo   /etc/aios/geo.csv                   # optional

  # Report to your hub: your aios-webserver URL + its honeypot_hub prefix + /ingest.
  env_honeypot_forward https://hub.example.com/honeypot/ingest    # CHANGE-ME
  env_honeypot_token_file /etc/aios/fleet.token

  env_honeypot_collect_url https://cdn-assets.example.com/px       # CHANGE-ME (a subdomain you own -> this server)
  env_honeypot_collect /px/

  # the bait paths nginx/Apache send here besides .env - keep in step with the front server's snippet
  honeypot_path /wp-config\.php
  honeypot_path /\.git/config
  honeypot_path \.\./|%2[eE]%2[eE]
}
