# aios-webserver config for the HUB box. The hub is also a node: its own grabs reach its own dashboard
# by forwarding to itself on 127.0.0.1 (the dashboard reads its own copy of the feed, not the edge's file).

vhost hub.example.com {
  listen 443 ssl
  cert /etc/aios/hub.crt                 # CHANGE-ME: your certificate chain
  key  /etc/aios/hub.key                 # CHANGE-ME

  # The dashboard + fleet intake, at https://hub.example.com/honeypot/ (nodes report to .../honeypot/ingest).
  # The dashboard app itself stays on 127.0.0.1:8577, reachable only through this relay.
  honeypot_hub /honeypot http://127.0.0.1:8577

  root /var/www/hub                     # CHANGE-ME

  env_honeypot on
  env_honeypot_store /var/lib/aios/honeypot-store
  env_honeypot_feed  /var/log/aios/honeypot.jsonl
  env_honeypot_geo   /etc/aios/geo.csv
  env_honeypot_forward http://127.0.0.1:8577/ingest    # this box's own dashboard
  env_honeypot_token_file /etc/aios/fleet.token
  env_honeypot_collect_url https://cdn-assets.example.com/px    # CHANGE-ME
  env_honeypot_collect /px/
}
