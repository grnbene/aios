<!doctype html>
<html><head><title>Tight and loose leading</title>
<style>body { background: #ffffff; margin: 16px; font: 16px sans-serif; }
h1 { font-size: 40px; line-height: 1.1; width: 360px; margin: 0; }
p.loose { line-height: 2; width: 300px; }
.n { line-height: normal; }
.pill { display: inline-block; padding: 4px 10px; border: 1px solid #ccc; border-radius: 12px; }</style></head>
<body><h1>A tight heading that wraps onto two lines</h1>
<p class="loose">Loose paragraph text set at double spacing, which centres each line in its box. <span class="n">Normal here.</span></p>
<p>Before <span class="pill">a pill</span> after, on one baseline.</p>
</body></html>
