<!doctype html>
<html><head><title>Float clearing and nested floats</title>
<style>
body { margin: 0; width: 600px; }
.parent-float { float: left; width: 250px; background: #555; padding: 10px; box-sizing: border-box; }
.nested-left { float: left; width: 100px; height: 50px; background: #c33; }
.nested-right { float: right; width: 80px; height: 50px; background: #33c; }
.nested-clear { clear: both; background: #3c3; height: 20px; }
.outer-right { float: right; width: 120px; height: 60px; background: #cc3; }
.outer-clear { clear: both; background: #999; height: 30px; }
</style></head>
<body>
<div class="parent-float">
  <div class="nested-left">NL</div>
  <div class="nested-right">NR</div>
  <div class="nested-clear">NC</div>
</div>
<div class="outer-right">OR</div>
<div class="outer-clear">Cleared outer</div>
</body></html>
