<!doctype html>
<html><head><title>A visited link</title>
<style>
body { margin: 20px; font: 14px sans-serif; background: #ffffff; }
a { color: #1a0dab; }
a:visited { color: #681da8; }
p { margin: 0 0 12px; }
#here { padding: 10px; background: #eeeeee; }
</style></head>
<body>
<p><a id="go" href="#here">A link into this page</a> and <a id="other" href="elsewhere.html">one to another page</a>.</p>
<p id="here">Following the first link makes it a visited one: it takes the :visited colour. The second stays unvisited.</p>
</body></html>
