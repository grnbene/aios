<!doctype html>
<html><head><title>Inline SVG icons</title><link rel="stylesheet" href="site.css">
<style>
.row { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
svg { width: 20px; height: 20px; }
.big svg { width: 32px; height: 32px; }
.tinted { color: #0f8a6a; }
</style></head>
<body><div class="wrap">
<h2>Icons, drawn from their own markup</h2>
<div class="row">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12h18M12 3v18"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 13 9 18 20 6"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 L22 20 L2 20 Z"/></svg>
  <span>stroke, fill, curve, polyline, closed path</span>
</div>
<div class="row big tinted">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0 -16 0"/></svg>
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 C6 8 6 16 12 22 C18 16 18 8 12 2 Z"/></svg>
  <span>an arc, and a cubic — at thirty-two, tinted by currentColor</span>
</div>
</div></body></html>
