<!doctype html>
<html><head><title>A light ground and no ink</title>
<style>
/* Exactly what example.com does: a background, and no colour at all -- because
   the author already knew what their browser's default text colour was. */
body { background-color: #f0f0f2; font-family: sans-serif; margin: 24px; }
</style></head>
<body>
<h1>A light ground and no ink</h1>
<p>The page never named a text colour. On a dark default sheet that used to come
out #d8d8d8 on #f0f0f2 — grey on grey.</p>
<p>An <a href="/somewhere">inline link</a> and some <code>code()</code>.</p>
</body></html>
