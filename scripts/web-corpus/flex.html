<!doctype html>
<html><head><title>Flex row</title><link rel="stylesheet" href="site.css">
<style>
.bar { display: flex; gap: 12px; align-items: center; padding: 10px; background: #f2f2f2; }
.bar .grow { flex-grow: 1; }
.pill { padding: 4px 10px; background: #0f6ab0; color: #ffffff; }
.cols { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
.card { flex-grow: 1; min-width: 160px; padding: 12px; border: 1px solid #d0d0d0; }
</style></head>
<body><div class="wrap">
<div class="bar"><span>Label</span><span class="grow">Grows to fill</span><span class="pill">Badge</span></div>
<div class="cols">
  <div class="card"><h3>First</h3><p>One of three that share the row.</p></div>
  <div class="card"><h3>Second</h3><p>Same edges, same padding.</p></div>
  <div class="card"><h3>Third</h3><p>Wraps when the row runs out.</p></div>
</div>
</div></body></html>
