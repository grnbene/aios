<!doctype html>
<html><head><title>Unitless line-height</title>
<style>
body { margin: 0; }
.parent { line-height: 2; font-size: 14px; background: #222; }
.big { font-size: 28px; background: #333; }
.small { font-size: 10px; background: #444; }
</style></head>
<body>
<div class="parent">
  <div class="big">Big text with inherited factor 2</div>
  <div class="small">Small text with inherited factor 2</div>
</div>
</body></html>
