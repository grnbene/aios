<!doctype html>
<html><head><title>Box shadow on transparent box</title>
<style>
body { margin: 0; background: #fff; }
.card {
  width: 200px;
  height: 60px;
  background: transparent;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
}
</style></head>
<body>
<div class="card">Transparent box</div>
</body></html>
