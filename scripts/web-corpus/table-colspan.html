<!doctype html>
<html><head><title>Table Colspan</title><link rel="stylesheet" href="site.css"></head>
<body><div class="wrap">
<h2>Colspan and row spacing</h2>
<table border="0" cellpadding="0" cellspacing="0">
  <tr>
    <td>1.</td>
    <td>^</td>
    <td>First story title here</td>
  </tr>
  <tr>
    <td colspan="2"></td>
    <td>100 points by user 2 hours ago | 42 comments</td>
  </tr>
  <tr style="height: 10px"></tr>
  <tr>
    <td colspan="2">Notice:</td>
    <td>Second story title following colspan</td>
  </tr>
</table>
</div></body></html>
