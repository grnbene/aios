<!doctype html>
<html><head><title>Bubbles against their containing block</title><style>
*{box-sizing:border-box;margin:0}
body{background:#111;color:#ddd;font:14px sans-serif}
.log{display:flex;flex-direction:column;gap:14px;padding:4px 2px 10px;width:1600px}
.msg{max-width:78%;padding:11px 14px;border-radius:8px}
.msg.user{align-self:flex-end;max-width:min(52ch,68%);padding:7px 12px;line-height:1.45;
          background:#2a2a2a;color:#f4f4f4;border:1px solid #444;border-radius:14px 14px 4px 14px;position:relative}
.msg.agent{align-self:flex-start;background:#1b1b1b;border:1px solid #333}
</style></head><body>
<div class="log">
<div class="msg agent">Hi — what can I help you with?</div>
<div class="msg user">hi</div>
<div class="msg user">name the capital of France in one word</div>
<div class="msg agent">A longer agent message, to check that the seventy-eight percent cap is a percentage of the column and not of the message's own text — which is what made a line that fitted wrap.</div>
</div></body></html>
