<!doctype html>
<html><head><title>Grid tracks</title><link rel="stylesheet" href="site.css">
<style>
.g { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; }
.g > div { padding: 10px; background: #f6f6f6; }
.wide { grid-template-columns: 240px 1fr; gap: 20px; margin-top: 20px; }
</style></head>
<body><div class="wrap">
<div class="g"><div>Two fractions wide</div><div>One</div><div>One</div></div>
<div class="g wide"><div>A fixed 240px rail</div><div>The rest of the room</div></div>
</div></body></html>
