# grain on every OS it ships for: build the standalone `grain` and run its
# golden tests (grain/tests). Runs when grain or what it is built from changes.
name: grain

on:
  push:
    paths:
      - 'grain/**'
      - 'src/userland/grain_*'
      - 'src/userland/font_atlas.cpp'
      - 'src/userland/glyph_engine.cpp'
      - 'src/hal/**'
      - 'src/crypto/**'
      - 'src/js/regexp.*'
      - 'src/js/unicode.*'
      - 'src/net/tls*'
      - 'src/node/secure.*'
      - 'src/channel/http_client.*'
      - 'src/core/**'
      - 'include/aios/userland/grain.hpp'
      - 'cli/grain_net.*'
      - 'examples/grain/**'
      - 'tools/grain-jit/cases/**'
      - '.github/workflows/grain.yml'
  pull_request:
    paths:
      - 'grain/**'
      - 'src/userland/grain_*'
      - 'src/hal/**'
      - 'src/crypto/**'
      - 'include/aios/userland/grain.hpp'
      - 'examples/grain/**'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-14 }
          - { name: macos-x86_64,  os: macos-13 }
          - { name: linux-x86_64,  os: ubuntu-24.04 }
          - { name: windows-x64,   os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S grain -B build-grain -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build-grain --config Release --parallel
      - name: test
        run: ctest --test-dir build-grain -C Release --output-on-failure --parallel 4
      - name: keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: grain-${{ matrix.name }}
          path: |
            build-grain/grain
            build-grain/Release/grain.exe
          if-no-files-found: error

  # The release Linux binary: glibc 2.17, libstdc++ linked in (grain/scripts/build-linux.sh).
  linux-portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build and test in manylinux2014
        run: grain/scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grain-linux-x86_64-glibc2.17
          path: grain/dist/
          if-no-files-found: error
